name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

  docker-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker runtime path
        shell: bash
        run: |
          set -o pipefail
          bash scripts/verify-docker-runtime.sh 2>&1 | tee docker-runtime.log

      - name: Upload Docker verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-runtime-log
          path: docker-runtime.log
          if-no-files-found: error
